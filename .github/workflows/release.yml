name: Build & Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Ataç.app & Release Archives
        run: |
          chmod +x build.sh package_release.sh
          ./build.sh
          ./package_release.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Atac-macOS
          path: |
            build/*.dmg
            build/*.zip

      - name: Publish GitHub Release (if not already published)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; keeping existing assets & SHA-256 intact."
          else
            gh release create "${GITHUB_REF_NAME}" build/*.dmg build/*.zip --generate-notes
          fi
